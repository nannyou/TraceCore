
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>総合探究系列</title>

  <style>
    * {
      box-sizing: border-box;
    }

    h1 {
        color: black;
        text-align: center;
        font-size: 30px;
    }

    body {
      margin: 0;
      padding: 30px 20px;
      font-family: "Noto Sans JP", "Yu Gothic",
        "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      background-color: #ffffff;
      color: #333333;
    }

    .gallery {
      max-width: 1150px;
      margin: 0 auto;

      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .gallery-item {
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      border-radius: 8px;
      background-color: #eeeeee;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      margin: auto;
      transition: transform 0.3s ease;
    }

    .gallery-item img:hover {
      transform: scale(1.05);
    }

    @media screen and (max-width: 600px) {
      body {
        padding: 20px 12px;
      }

      .gallery {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
    }
  </style>
</head>

<body>
    <h1>総合探究系列</h1>
  <div class="gallery">
    <div class="gallery-item">
      <img src="1.png" alt="写真1">
    </div>
